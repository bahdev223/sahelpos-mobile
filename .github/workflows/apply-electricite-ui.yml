name: Apply reviewed electrical profile integration
on:
  push:
    branches: [feat/electricite-commerce-general]
    paths: ['.automation/wire_electricite.py', '.github/workflows/apply-electricite-ui.yml']
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: github.repository == 'bahdev223/sahelpos-mobile' && github.ref == 'refs/heads/feat/electricite-commerce-general'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply and verify the reviewed source tree (no application execution)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          reference = 'app/quincaillerie/reference/[id].tsx'
          before = Path(reference).read_text()
          observed = subprocess.check_output(['git', 'hash-object', reference], text=True).strip()
          if observed != '3e797b0a136f253c21c189b2f2c416b27a5e9603':
              raise SystemExit('Reference source changed; review again before patching')
          changes = [
              ("import { useSession } from '../../_layout';", "import { useSession } from '../../_layout';\nimport { libelleReferenceTechnique, routeCaracteristiquesTechniques } from '../../../src/domain/presentation-commerce';"),
              ('  const { boutique, synchroniserMaintenant } = useSession();', '  const { boutique, profilCommerce, synchroniserMaintenant } = useSession();'),
              ('<Text style={s.muted}>Référence Quincaillerie</Text>', '<Text style={s.muted}>{libelleReferenceTechnique(profilCommerce)}</Text>'),
              ("router.push({pathname:'/quincaillerie/caracteristiques/[id]',params:{id:String(p.id)}})", 'router.push(routeCaracteristiquesTechniques(profilCommerce, p.id))'),
          ]
          expected_reference = before
          for old, new in changes:
              if expected_reference.count(old) != 1:
                  raise SystemExit('Unexpected reference structure')
              expected_reference = expected_reference.replace(old, new)
          source = Path('.automation/wire_electricite.py').read_text()
          old = "c = rep(c, '  const { boutique } = useSession();', '  const { boutique, profilCommerce } = useSession();')"
          new = "c = rep(c, '  const { boutique, synchroniserMaintenant } = useSession();', '  const { boutique, profilCommerce, synchroniserMaintenant } = useSession();')"
          if source.count(old) != 1:
              raise SystemExit('Unexpected reviewed transformation')
          exec(compile(source.replace(old, new), '.automation/wire_electricite.py', 'exec'), {})
          if Path(reference).read_text() != expected_reference:
              raise SystemExit('Reference diff contains an unreviewed change')
          expected = {
            'app/(tabs)/caisse.tsx': 'f66e072c3150cd67a10175f9f446e0e736bcc16c',
            'app/(tabs)/catalogue.tsx': '855d001928cf08c09c522f1263f15e2bb0c21da6',
            'app/achats/[id].tsx': '62f532cad7decd0350abb502b691ac09880df7b6',
            'app/achats/nouveau.tsx': 'f7055da077cf3f0e0e77de3b96381c40d1550ee9',
            'app/electricite/caracteristiques/[id].tsx': 'cae9a760d5d9b4e989541f6b94cf84ccc4af0ec6',
            'app/electricite/reference/[id].tsx': '9366a55d3f88d48751a6db02efd2e1ce7c17d7c6',
            'app/habillement/commandes/[id].tsx': 'f86898098ee3e036edc08b1264cf58842f8c4faa',
            'app/habillement/commandes/index.tsx': 'd581393ee0c905d36a4a4794559acbe25f88a418',
            'app/habillement/modele/nouveau.tsx': '2b4bfe0d41406f76b4d51ce671cb692f9a6c1fab',
            'app/produit/nouveau.tsx': '33d124dcc38b2f256fb14bca1a026b45b17d86bd',
            'app/stock/commande.tsx': '2d7d769c00dd08e4ad91b288007b307b9473b7c7',
            'src/services/pdf.ts': 'e06f71ddd9b508a7e27bc5c37cbc4c94e578ad6e',
            'src/services/synchronisation.ts': '74729991232e04d9a4aa296c547027bf007b173a',
            'src/ui/tiroir.tsx': '464a5cee5d1acf49b3840d1ed3a68250801f7036',
          }
          for filename, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', filename], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Reviewed blob mismatch: {filename}')
          paths = [*expected, reference]
          subprocess.run(['git', 'add', '--', *paths], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != set(paths):
              raise SystemExit('Unexpected staged paths')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('15 source files verified; existing reference matrix preserved.')
          PY
      - name: Commit only to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(commerce): wire electrical and general retail screens with checked pricing'
          git push origin HEAD:refs/heads/feat/electricite-commerce-general
